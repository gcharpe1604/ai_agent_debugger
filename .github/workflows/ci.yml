name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv run --python ${{ matrix.python }} --project sdk/python --locked --extra test
          python -B -m pytest -q -p no:cacheprovider sdk/python/tests

  integration:
    name: Backend + SDK integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The test puts backend/src and sdk/python/src on sys.path, so the
      # backend env also needs the SDK's OpenTelemetry dependencies.
      - run: >
          uv run --project backend --locked
          --with "opentelemetry-api>=1,<2" --with "opentelemetry-sdk>=1,<2"
          python -B -m unittest tests/integration/test_telemetry.py
      - name: Backend unit tests
        working-directory: backend
        run: uv run --locked python -B -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
