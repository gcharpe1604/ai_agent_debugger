[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-debugger-backend"
version = "0.1.0"
description = "Backend API for the AI Agent Execution Debugging & Trace Analysis Platform"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.140.2,<0.141.0",
    "uvicorn>=0.52.3,<0.53.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "clickhouse-connect>=1.12.0,<1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
