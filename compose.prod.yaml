# Production stack for one VM (4 GB RAM + 2 GB swap). See docs/deployment.md.
#   cp .env.prod.example .env.prod   # fill it in
#   docker compose -f compose.prod.yaml up -d --build
# Only Caddy publishes ports (80, 443). Every setting comes from .env.prod.
name: agent-debugger

x-env: &env
  env_file:
    - path: .env.prod
      required: true

services:
  postgres:
    image: postgres:17
    <<: *env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m

  # Single-node KRaft, one client listener (INTERNAL) for containers only.
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    environment:
      CLUSTER_ID: "TqBMhjDQRcCSjbFREjzraQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 900m

  # One-shot: creates the topics, then exits 0. Safe to re-run.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic agentdbg.traces.v1 --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic agentdbg.traces.v1.dlq --partitions 1 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    <<: *env
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 1536m

  # Runs `alembic upgrade head`, then uvicorn on :8008 (backend/docker-entrypoint.sh).
  api:
    build:
      context: ./backend
    image: agent-debugger-backend:local
    <<: *env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 384m

  # Same image as api (the second build is a cache hit); creates the ClickHouse table at start.
  trace-writer:
    build:
      context: ./backend
    image: agent-debugger-backend:local
    <<: *env
    command: ["python", "-m", "agent_debugger_api.trace_writer"]
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: agent-debugger-web:local
    <<: *env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  postgres_data:
  kafka_data:
  clickhouse_data:
  caddy_data:
  caddy_config:
