services:
  postgres:
    image: postgres:17
    container_name: agent-debugger-postgres
    environment:
      POSTGRES_DB: agent_debugger
      POSTGRES_USER: agent_debugger
      POSTGRES_PASSWORD: agent_debugger
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_debugger -d agent_debugger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: