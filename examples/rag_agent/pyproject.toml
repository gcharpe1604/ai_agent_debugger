[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novacloud-rag-agent"
version = "0.1.0"
description = "Standalone NovaCloud RAG workload with controlled and live modes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ai-agent-debugger-sdk", "pydantic>=2.0,<3", "PyYAML>=6.0,<7", "httpx>=0.28,<0.29", "python-dotenv>=1.2.3,<2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
novacloud-rag = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_agent = ["data/knowledge_base/*.md", "data/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
ai-agent-debugger-sdk = { path = "../../sdk/python", editable = true }
