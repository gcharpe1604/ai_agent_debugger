[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-using-task-agent"
version = "0.1.0"
description = "Independent deterministic order-fulfillment evaluation workload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
tool-task-agent = "tool_task_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tool_task_agent = ["data/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

