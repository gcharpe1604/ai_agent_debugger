[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-planning-agent"
version = "0.1.0"
description = "Controlled and live research and decision-planning workload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<0.29", "python-dotenv>=1.2.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.16,<0.17"]

[project.scripts]
research-planning-agent = "research_planning_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_planning_agent = ["data/*.json", "data/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
