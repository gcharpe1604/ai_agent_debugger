[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-debugger-sdk"
version = "0.1.0"
description = "Python SDK for the AI Agent Execution Debugging & Trace Analysis Platform"
requires-python = ">=3.10"

dependencies = [
    "opentelemetry-api>=1,<2",
    "opentelemetry-sdk>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]